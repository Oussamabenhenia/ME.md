name: Update stats
on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday
  workflow_dispatch:
permissions: {}
concurrency: stats
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit only if the numbers changed
        run: |
          git diff --quiet -- assets/stats-light.svg assets/stats-dark.svg assets/stats.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg assets/stats.json
          git commit -m "chore: refresh stats"
          git push
