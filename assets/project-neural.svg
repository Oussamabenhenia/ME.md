<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d"><title id="t">Neural Agent</title><desc id="d">Project 04. Neural Agent, a Windows desktop assistant built on local Ollama models. Public repository. It opens apps and websites, reads and writes files, reports system status, and asks before typing.</desc><style>.g0{opacity:0;animation:sh .01s 0.6s forwards}.g1{opacity:0;animation:sh .01s 1.5s forwards}.g2{opacity:0;animation:sh .01s 2.4s forwards}.g3{opacity:0;animation:sh .01s 3.3s forwards}@keyframes sh{to{opacity:1}}@media (prefers-reduced-motion: reduce){[class^=g]{opacity:1!important}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .25  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .11 0"/></filter></defs><rect width="1200" height="400" fill="#F3ECDD"/><rect width="1200" height="400" filter="url(#grain)"/>
<rect x="720" y="0" width="480" height="400" fill="#BDAED0"/><rect x="720" y="0" width="480" height="400" filter="url(#grain)"/>
