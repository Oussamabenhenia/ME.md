<text x="44" y="172" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Charter','Bitstream Charter',Georgia,serif" font-size="124" font-weight="400" fill="#1B1814" text-anchor="start" letter-spacing="-4" textLength="400" lengthAdjust="spacingAndGlyphs">Neural</text>
