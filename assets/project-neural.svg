<text x="50" y="340" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Charter','Bitstream Charter',Georgia,serif" font-size="21" font-weight="400" fill="#6B6457" text-anchor="start" letter-spacing="0" font-style="italic" >A Windows assistant that runs on local models. No cloud, no API key.</text>
