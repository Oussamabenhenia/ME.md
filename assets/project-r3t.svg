<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d"><title id="t">R3T: real-time railway tracking</title><desc id="d">Project 01. R3T, a phone-first progressive web app for real-time railway tracking. Private repository. Drawing: a transit-style route map with a live position against the timetable estimate, and a time-distance chart where the live train line drifts from the scheduled paths.</desc><style>@keyframes dr{0%{stroke-dashoffset:100}70%,100%{stroke-dashoffset:0}}@keyframes mv{0%{offset-distance:0%;opacity:0}6%{opacity:1}70%{offset-distance:100%;opacity:1}94%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:0}}.live{stroke-dasharray:100;animation:dr 12s cubic-bezier(.5,0,.4,1) infinite}.m{transform:translate(770px,146px)}@supports (offset-path: path('M0 0')){.m{transform:none;offset-path:path('M440 196 H560 L610 146 H770');offset-rotate:0deg;animation:mv 12s cubic-bezier(.5,0,.4,1) infinite}}@media (prefers-reduced-motion: reduce){.live{stroke-dashoffset:0}.m{offset-path:none!important;transform:translate(770px,146px)!important;opacity:1!important}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><pattern id="sp1" width="140" height="140" patternUnits="userSpaceOnUse"><circle cx="33.3" cy="76.2" r="0.9" fill="#F3ECDD" fill-opacity="0.15"/><circle cx="66.4" cy="81.3" r="1.6" fill="#F3ECDD" fill-opacity="0.05"/><circle cx="117.2" cy="36.3" r="0.7" fill="#F3ECDD" fill-opacity="0.07"/><circle cx="100.4" cy="75.7" r="1.6" fill="#F3ECDD" fill-opacity="0.10"/><circle cx="89.5" cy="21.1" r="0.7" fill="#F3ECDD" fill-opacity="0.15"/><circle cx="73.2" cy="103.8" r="0.5" fill="#F3ECDD" fill-opacity="0.07"/><circle cx="134.0" cy="6.0" r="0.5" fill="#F3ECDD" fill-opacity="0.14"/><circle cx="37.7" cy="83.3" r="1.2" fill="#F3ECDD" fill-opacity="0.13"/><circle cx="129.0" cy="55.3" r="1.6" fill="#F3ECDD" fill-opacity="0.10"/><circle cx="131.0" cy="123.0" r="0