<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">R3T: real-time railway tracking</title><desc id="d">Project 01. R3T, a mobile-first progressive web app for real-time railway tracking. Private repository. Drawing: a route line showing live position against timetable estimate, above railway tracks in perspective.</desc><style>@keyframes go{0%{transform:translateX(0);opacity:0}10%{opacity:1}82%{opacity:1}100%{transform:translateX(340px);opacity:0}}.m{animation:go 11s cubic-bezier(.5,0,.5,1) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .25  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .11 0"/></filter></defs><rect width="1200" height="470" fill="#1B1814"/><rect width="1200" height="470" filter="url(#grain)"/>
